<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Editor de Vídeo</title>
<style>
  /* ====== ESTILOS (apariencia de la app) ====== */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f1ec;
    color: #222;
  }
  header {
    background: #7a1f3d;
    color: #fff;
    padding: 18px 24px;
  }
  header h1 { margin: 0 0 4px; font-size: 1.6rem; }
  header p { margin: 0; opacity: .9; font-size: .95rem; }
  main {
    max-width: 1100px;
    margin: 20px auto;
    padding: 0 16px;
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 16px;
  }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .ancho { grid-column: 1 / -1; }
  h2 { font-size: 1rem; margin: 16px 0 8px; color: #7a1f3d; }
  h2:first-child { margin-top: 0; }
  label { display: block; margin: 6px 0; font-size: .9rem; }
  input[type=range] { width: 100%; }
  input[type=text], select { width: 100%; padding: 6px; font-size: .95rem; }
  canvas {
    width: 100%;
    height: auto;
    background: #000;
    border-radius: 8px;
    display: block;
  }
  /* El vídeo original queda oculto: lo que se ve es el lienzo (canvas) con los efectos */
  .oculto { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  button, .boton {
    background: #7a1f3d;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: .95rem;
    cursor: pointer;
    display: inline-block;
  }
  button:disabled { background: #bbb; cursor: not-allowed; }
  button.secundario { background: #555; }
  .fila { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  progress { width: 100%; height: 14px; margin-top: 10px; }
  .logo-opcion { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .logo-opcion img { height: 28px; background: #eee; border-radius: 4px; padding: 2px; }
  #estado { font-size: .9rem; color: #555; }
</style>
</head>
<body>

<header>
  <h1>🎬 Mini Editor de Vídeo</h1>
  <p>Recorta, aplica filtros, añade un título y descarga tu vídeo. Todo ocurre en tu navegador: el vídeo no se sube a ningún sitio.</p>
</header>

<main>
  <!-- ====== 1. CARGAR VÍDEO ====== -->
  <section class="panel ancho">
    <div class="fila" style="margin-top:0">
      <label class="boton" for="archivo" style="margin:0">📂 Elegir vídeo</label>
      <input type="file" id="archivo" accept="video/*" hidden>
      <span id="nombreArchivo">Ningún vídeo cargado</span>
    </div>
  </section>

  <!-- ====== 2. VISOR ====== -->
  <section class="panel">
    <canvas id="lienzo" width="640" height="360"></canvas>
    <video id="video" class="oculto" playsinline></video>
    <div class="fila">
      <button id="btnPlay" disabled>▶ Reproducir</button>
      <span id="tiempo">0:00 / 0:00</span>
    </div>
  </section>

  <!-- ====== 3. AJUSTES ====== -->
  <section class="panel">
    <h2>✂️ Recortar</h2>
    <label>Inicio: <b id="valInicio">0.0</b> s
      <input type="range" id="inicio" min="0" max="0" step="0.1" value="0">
    </label>
    <label>Fin: <b id="valFin">0.0</b> s
      <input type="range" id="fin" min="0" max="0" step="0.1" value="0">
    </label>

    <h2>🎨 Filtros</h2>
    <label>Brillo <input type="range" id="brillo" min="0" max="200" value="100"></label>
    <label>Contraste <input type="range" id="contraste" min="0" max="200" value="100"></label>
    <label>Saturación <input type="range" id="saturacion" min="0" max="200" value="100"></label>
    <label>Blanco y negro <input type="range" id="bn" min="0" max="100" value="0"></label>

    <h2>⏩ Velocidad</h2>
    <select id="velocidad">
      <option value="0.5">0,5× (cámara lenta)</option>
      <option value="1" selected>1× (normal)</option>
      <option value="1.5">1,5×</option>
      <option value="2">2× (rápido)</option>
    </select>

    <h2>🔤 Título</h2>
    <input type="text" id="titulo" placeholder="Escribe un título...">
    <div class="fila">
      <label style="margin:0">Color <input type="color" id="colorTitulo" value="#ffffff"></label>
      <select id="posicion" style="width:auto">
        <option value="abajo">Abajo</option>
        <option value="arriba">Arriba</option>
      </select>
    </div>

    <h2>🏷️ Logos (esquina inferior derecha)</h2>
    <div id="listaLogos"></div>
    <label>Tamaño <input type="range" id="tamLogo" min="8" max="35" value="18"></label>
    <label><input type="checkbox" id="fondoLogo" checked> Fondo blanco detrás de los logos</label>

    <div class="fila">
      <button id="btnReset" class="secundario">↺ Restablecer filtros</button>
    </div>
  </section>

  <!-- ====== 4. EXPORTAR ====== -->
  <section class="panel ancho">
    <button id="btnExportar" disabled>💾 Exportar vídeo</button>
    <progress id="progreso" value="0" max="100" hidden></progress>
    <p id="estado">Carga un vídeo para empezar.</p>
  </section>
</main>

<!-- =========================================================

     archivo (formato base64). Así la app funciona con un solo archivo,
     tanto en tu ordenador como en GitHub Pages.
     ========================================================= -->

<script>
/* =========================================================
   PASO 1: Conectamos el código con los elementos de la página
   ========================================================= */
const $ = id => document.getElementById(id);
const archivo = $('archivo'), video = $('video'), lienzo = $('lienzo');
const ctx = lienzo.getContext('2d');
const inicio = $('inicio'), fin = $('fin');
const brillo = $('brillo'), contraste = $('contraste'), saturacion = $('saturacion'), bn = $('bn');
const velocidad = $('velocidad'), titulo = $('titulo'), colorTitulo = $('colorTitulo'), posicion = $('posicion');
const btnPlay = $('btnPlay'), btnExportar = $('btnExportar'), btnReset = $('btnReset');
const progreso = $('progreso'), estado = $('estado');

let audioCtx = null, destinoAudio = null;   // para grabar el sonido
let grabador = null, exportando = false;
const tamLogo = $('tamLogo'), fondoLogo = $('fondoLogo');

/* Creamos una casilla por cada logo de la lista LOGOS (está más abajo, al final del archivo) */
const logosCargados = LOGOS.map(logo => {
  const img = new Image();
  img.src = logo.imagen;
  const fila = document.createElement('label');
  fila.className = 'logo-opcion';
  const casilla = document.createElement('input');
  casilla.type = 'checkbox';
  const miniatura = document.createElement('img');
  miniatura.src = logo.imagen;
  fila.append(casilla, miniatura, logo.nombre);
  $('listaLogos').append(fila);
  casilla.addEventListener('change', () => { if (video.paused) dibujar(); });
  return { img, casilla };
});

// Convierte segundos en formato 1:05
function formatear(seg) {
  const m = Math.floor(seg / 60);
  const s = Math.floor(seg % 60).toString().padStart(2, '0');
  return m + ':' + s;
}

/* =========================================================
   PASO 2: Cargar el vídeo que elige el usuario
   ========================================================= */
archivo.addEventListener('change', () => {
  const f = archivo.files[0];
  if (!f) return;
  $('nombreArchivo').textContent = f.name;
  video.src = URL.createObjectURL(f);   // el vídeo se queda en tu ordenador
});

video.addEventListener('loadedmetadata', () => {
  // El lienzo toma el tamaño real del vídeo
  lienzo.width = video.videoWidth;
  lienzo.height = video.videoHeight;
  const d = video.duration.toFixed(1);
  inicio.max = fin.max = d;
  inicio.value = 0;
  fin.value = d;
  actualizarEtiquetas();
  btnPlay.disabled = btnExportar.disabled = false;
  estado.textContent = 'Vídeo listo. Ajusta lo que quieras y pulsa Exportar.';
  video.currentTime = 0;
});

// Cuando el vídeo salta a otro punto, redibujamos ese fotograma
video.addEventListener('seeked', dibujar);

/* =========================================================
   PASO 3: Dibujar cada fotograma con los filtros y el título
   ========================================================= */
function filtroCSS() {
  return `brightness(${brillo.value}%) contrast(${contraste.value}%) ` +
         `saturate(${saturacion.value}%) grayscale(${bn.value}%)`;
}

function dibujar() {
  if (!video.videoWidth) return;
  ctx.filter = filtroCSS();
  ctx.drawImage(video, 0, 0, lienzo.width, lienzo.height);
  ctx.filter = 'none';

  // Primero los logos: así sabemos dónde empiezan y el título no los pisa
  const arribaLogos = dibujarLogos();

  const texto = titulo.value.trim();
  if (texto) {
    const tam = Math.round(lienzo.height / 12);
    ctx.font = `bold ${tam}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.lineWidth = tam / 8;
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.fillStyle = colorTitulo.value;
    let y = posicion.value === 'arriba' ? tam * 1.4 : lienzo.height - tam * 0.8;
    // Si el título va abajo y hay logos, lo subimos por encima de ellos
    if (posicion.value === 'abajo') y = Math.min(y, arribaLogos - tam * 0.4);
    ctx.strokeText(texto, lienzo.width / 2, y);
    ctx.fillText(texto, lienzo.width / 2, y);
  }
}

/* Logos marcados: se colocan en fila, empezando por la esquina inferior derecha */
function dibujarLogos() {
  const elegidos = logosCargados.filter(l => l.casilla.checked && l.img.complete);
  if (!elegidos.length) return lienzo.height;   // sin logos: no ocupan sitio

  const alto = lienzo.height * tamLogo.value / 100;   // altura de cada logo
  const margen = lienzo.height * 0.03;                // separación con el borde
  const hueco = alto * 0.15;                          // espacio entre logos
  const relleno = alto * 0.1;                         // aire dentro del fondo blanco

  // Calculamos el ancho de cada logo manteniendo su proporción
  const anchos = elegidos.map(l => alto * l.img.naturalWidth / l.img.naturalHeight);
  const anchoTotal = anchos.reduce((a, b) => a + b, 0) + hueco * (elegidos.length - 1);

  let x = lienzo.width - margen - relleno - anchoTotal;
  const y = lienzo.height - margen - relleno - alto;

  if (fondoLogo.checked) {
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.beginPath();
    ctx.roundRect(x - relleno, y - relleno, anchoTotal + relleno * 2, alto + relleno * 2, relleno);
    ctx.fill();
  }
  elegidos.forEach((l, i) => {
    ctx.drawImage(l.img, x, y, anchos[i], alto);
    x += anchos[i] + hueco;
  });
  return y - relleno;   // altura donde empiezan los logos
}

// Bucle que se repite mientras el vídeo se reproduce
function bucle() {
  dibujar();
  const ini = parseFloat(inicio.value), f = parseFloat(fin.value);
  $('tiempo').textContent = formatear(video.currentTime) + ' / ' + formatear(video.duration);

  if (exportando) {
    progreso.value = Math.min(100, ((video.currentTime - ini) / (f - ini)) * 100);
  }
  // ¿Hemos llegado al punto de "Fin"?
  if (video.currentTime >= f - 0.03) {
    video.pause();
    terminarExportacion();
    return;
  }
  if (!video.paused && !video.ended) requestAnimationFrame(bucle);
}
video.addEventListener('play', () => requestAnimationFrame(bucle));
video.addEventListener('ended', terminarExportacion);
video.addEventListener('pause', () => { btnPlay.textContent = '▶ Reproducir'; });

/* =========================================================
   PASO 4: Botones y controles
   ========================================================= */
function prepararAudio() {
  // Se crea una sola vez: deja oír el sonido y a la vez grabarlo
  if (!audioCtx) {
    audioCtx = new AudioContext();
    const fuente = audioCtx.createMediaElementSource(video);
    destinoAudio = audioCtx.createMediaStreamDestination();
    fuente.connect(audioCtx.destination);
    fuente.connect(destinoAudio);
  }
  audioCtx.resume();
}

btnPlay.addEventListener('click', () => {
  if (video.paused) {
    const ini = parseFloat(inicio.value), f = parseFloat(fin.value);
    if (video.currentTime < ini || video.currentTime >= f - 0.05) video.currentTime = ini;
    video.playbackRate = parseFloat(velocidad.value);
    prepararAudio();
    video.play();
    btnPlay.textContent = '⏸ Pausa';
  } else {
    video.pause();
  }
});

function actualizarEtiquetas() {
  $('valInicio').textContent = parseFloat(inicio.value).toFixed(1);
  $('valFin').textContent = parseFloat(fin.value).toFixed(1);
}

// El inicio nunca puede pasar al fin (y al revés)
inicio.addEventListener('input', () => {
  if (parseFloat(inicio.value) >= parseFloat(fin.value)) inicio.value = (parseFloat(fin.value) - 0.1).toFixed(1);
  actualizarEtiquetas();
  video.currentTime = parseFloat(inicio.value);
});
fin.addEventListener('input', () => {
  if (parseFloat(fin.value) <= parseFloat(inicio.value)) fin.value = (parseFloat(inicio.value) + 0.1).toFixed(1);
  actualizarEtiquetas();
  video.currentTime = parseFloat(fin.value);
});

velocidad.addEventListener('change', () => { video.playbackRate = parseFloat(velocidad.value); });

// Si cambias un filtro o el título con el vídeo en pausa, se ve al momento
[brillo, contraste, saturacion, bn, titulo, colorTitulo, posicion, tamLogo, fondoLogo].forEach(el =>
  el.addEventListener('input', () => { if (video.paused) dibujar(); })
);

btnReset.addEventListener('click', () => {
  brillo.value = contraste.value = saturacion.value = 100;
  bn.value = 0;
  dibujar();
});

/* =========================================================
   PASO 5: Exportar = reproducir el trozo elegido y grabarlo
   ========================================================= */
btnExportar.addEventListener('click', async () => {
  prepararAudio();
  video.pause();

  // Vamos al punto de inicio y esperamos a que esté listo
  const listo = new Promise(r => video.addEventListener('seeked', r, { once: true }));
  video.currentTime = parseFloat(inicio.value);
  await listo;

  // Juntamos la imagen del lienzo con el sonido
  const flujo = lienzo.captureStream(30);
  destinoAudio.stream.getAudioTracks().forEach(pista => flujo.addTrack(pista));

  // Elegimos un formato que el navegador sepa grabar
  const formatos = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'];
  const tipo = formatos.find(t => MediaRecorder.isTypeSupported(t));
  grabador = new MediaRecorder(flujo, tipo ? { mimeType: tipo } : {});

  const trozos = [];
  grabador.ondataavailable = e => { if (e.data.size) trozos.push(e.data); };
  grabador.onstop = () => {
    const blob = new Blob(trozos, { type: grabador.mimeType });
    const ext = grabador.mimeType.includes('mp4') ? 'mp4' : 'webm';
    const enlace = document.createElement('a');
    enlace.href = URL.createObjectURL(blob);
    enlace.download = 'mi-video-editado.' + ext;
    enlace.click();
    estado.textContent = '✅ ¡Hecho! Tu vídeo se ha descargado (' + ext.toUpperCase() + ').';
    progreso.hidden = true;
    bloquear(false);
  };

  exportando = true;
  bloquear(true);
  progreso.hidden = false;
  progreso.value = 0;
  estado.textContent = '⏺ Grabando... no cambies de pestaña hasta que termine.';

  video.playbackRate = parseFloat(velocidad.value);
  grabador.start(250);
  await video.play();
});

function terminarExportacion() {
  if (exportando && grabador && grabador.state === 'recording') {
    exportando = false;
    grabador.stop();
  }
}

function bloquear(si) {
  [btnPlay, btnExportar, inicio, fin, velocidad, archivo].forEach(el => el.disabled = si);
}
</script>
